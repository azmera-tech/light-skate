name: Build Flutter APK

# Builds a real, installable Android APK on every push that touches mobile/, and on request.
# GitHub's hosted runners come with the Android SDK preinstalled, which is why this lives in CI
# rather than being built locally: it needs no Android Studio install on anyone's machine.
on:
  push:
    branches: [main, master]
    paths: ['mobile/**', '.github/workflows/build-mobile-apk.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL the app should talk to (e.g. https://your-venue.example.com)'
        required: false
        default: 'http://localhost:8090'

permissions:
  contents: write # needed by the "publish APK to repo" step below

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'http://localhost:8090' }}
      - uses: actions/upload-artifact@v4
        with:
          name: light-skate-mobile.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      # Actions artifacts above live on Azure Blob Storage, which some network setups (including the
      # sandbox this project was built in) cannot reach. This step gives a second, plain-git path to
      # the same file: it force-pushes the built APK to a dedicated orphan branch, so it can be pulled
      # with nothing more than `git fetch` + `git show` against github.com itself.
      - name: Also publish the APK on the apk-builds branch (git-only download path)
        working-directory: ${{ github.workspace }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk /tmp/light-skate-mobile.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/light-skate-mobile.apk light-skate-mobile.apk
          git add light-skate-mobile.apk
          git commit -m "APK build from ${{ github.sha }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin apk-builds-tmp:apk-builds --force
