# Single-venue stack: PostgreSQL + Light Skate (API + embedded worker + web app).
# Copy .env.example to .env and set SIGNING_SECRET + POSTGRES_PASSWORD first.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lightskate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: lightskate
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lightskate"], interval: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://lightskate:${POSTGRES_PASSWORD}@db:5432/lightskate
      SIGNING_SECRET: ${SIGNING_SECRET:?set SIGNING_SECRET}
      EMBEDDED_WORKER: "true"
    ports: ["8080:8080"]
    volumes: [photos:/var/lib/light-skate/storage]
volumes: { dbdata: {}, photos: {} }
